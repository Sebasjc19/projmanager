name: CI Backend

on:
  push:
    branches: [main, develop, 'feature/*']
    paths:
      - 'apps/backend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/backend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'

env:
  NODE_VERSION: '20.x'

jobs:
  lint:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-lint-backend-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-lint-backend-

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npx turbo run lint --filter=backend

  type-check:
    name: Type Check Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-typecheck-backend-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-typecheck-backend-

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx turbo run type-check --filter=backend

  test:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-test-backend-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-test-backend-

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npx turbo run test:cov --filter=backend

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./apps/backend/coverage/lcov.info
          flags: backend
          name: backend-coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-build-backend-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-build-backend-

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npx turbo run build --filter=backend

      - name: Archive backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: apps/backend/dist
          retention-days: 7
